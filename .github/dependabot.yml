version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # react-scripts 5.0.1 pins its build-time eslint-webpack-plugin to the
      # eslint@8 API; eslint 9/10 removes options it relies on and breaks
      # `yarn build` outright.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # react-scripts' typescript compat patch only supports ^3 || ^4; jumping
      # past that breaks Yarn's install step for this package.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
